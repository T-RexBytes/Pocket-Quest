<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Quest — Forest Adventure</title>
  <style>
    :root {
      --bg-deep: #0a1410;
      --bg-mid: #122820;
      --panel: rgba(18, 40, 32, 0.92);
      --border: #2d5a45;
      --text: #d4e8dc;
      --text-dim: #8fb09a;
      --accent-green: #4caf7a;
      --accent-green-hover: #6dd49a;
      --gold: #c9a227;
      --gold-dim: #8a7120;
      --danger: #b54a4a;
      --font-story: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
      --font-ui: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-ui);
      color: var(--text);
      background: linear-gradient(165deg, var(--bg-deep) 0%, #0f2218 35%, var(--bg-mid) 70%, #081510 100%);
      background-attachment: fixed;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle forest silhouette via gradients only */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(20, 60, 40, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 20% 30%, rgba(76, 175, 122, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(201, 162, 39, 0.05) 0%, transparent 35%);
    }

    .game-wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    header h1 {
      font-family: var(--font-story);
      font-size: clamp(1.5rem, 4vw, 1.85rem);
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    header p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .hearts {
      display: flex;
      gap: 0.25rem;
    }

    .heart {
      width: 14px;
      height: 14px;
      background: var(--accent-green);
      clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 78%, 18% 100%, 0% 35%);
      opacity: 0.35;
      transition: opacity 0.2s;
    }

    .heart.filled {
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(76, 175, 122, 0.5));
    }

    .treasure-icon {
      width: 18px;
      height: 14px;
      border: 2px solid var(--gold-dim);
      border-radius: 2px 2px 4px 4px;
      position: relative;
      opacity: 0.4;
    }

    .treasure-icon.has-treasure {
      opacity: 1;
      border-color: var(--gold);
      background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dim) 100%);
      box-shadow: 0 0 8px rgba(201, 162, 39, 0.4);
    }

    .treasure-icon::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 4px;
      border: 2px solid inherit;
      border-bottom: none;
      border-radius: 2px 2px 0 0;
    }

    .story {
      padding: 1.5rem 1.25rem 1rem;
    }

    .scene-title {
      font-family: var(--font-story);
      font-size: 1.35rem;
      color: var(--accent-green-hover);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .scene-desc {
      font-family: var(--font-story);
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text);
    }

    .choices {
      padding: 0.5rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .choices.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .choice-btn {
      font-family: var(--font-ui);
      font-size: 0.95rem;
      text-align: left;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(45, 90, 69, 0.5) 0%, rgba(25, 55, 42, 0.8) 100%);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
    }

    .choice-btn:hover {
      border-color: var(--accent-green);
      background: linear-gradient(180deg, rgba(76, 175, 122, 0.25) 0%, rgba(35, 70, 55, 0.9) 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .choice-btn:active {
      transform: scale(0.98);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .choice-btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .footer-actions {
      padding: 0 1.25rem 1.25rem;
      display: none;
    }

    .footer-actions.visible {
      display: block;
    }

    .restart-btn {
      width: 100%;
      font-family: var(--font-ui);
      font-size: 1rem;
      padding: 0.9rem;
      border: 1px solid var(--gold);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(201, 162, 39, 0.2) 0%, rgba(138, 113, 32, 0.35) 100%);
      color: var(--gold);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .restart-btn:hover {
      background: linear-gradient(180deg, rgba(201, 162, 39, 0.35) 0%, rgba(138, 113, 32, 0.5) 100%);
    }

    .restart-btn:active {
      transform: scale(0.98);
    }

    .ending .scene-title {
      color: var(--gold);
    }

    .ending.bad .scene-title {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <header>
      <h1>Pocket Quest</h1>
      <p>A forest adventure</p>
    </header>

    <main class="panel" id="game-panel">
      <div class="status">
        <div class="status-item">
          <span class="status-label">Health</span>
          <div class="hearts" id="health-display" aria-label="Health"></div>
        </div>
        <div class="status-item">
          <span class="status-label">Treasure</span>
          <div class="treasure-icon" id="treasure-display" aria-label="Treasure"></div>
        </div>
      </div>

      <article class="story" id="story">
        <h2 class="scene-title" id="scene-title"></h2>
        <p class="scene-desc" id="scene-desc"></p>
      </article>

      <div class="choices" id="choices"></div>

      <div class="footer-actions" id="footer-actions">
        <button type="button" class="restart-btn" id="restart-btn">Restart Game</button>
      </div>
    </main>
  </div>

  <script>
    const INITIAL_HEALTH = 3;
    const START_SCENE = "wake";

    const scenes = {
      wake: {
        title: "Moss and Mist",
        description:
          "You wake on damp earth beneath a canopy of ancient pines. Mist curls between the trunks. Somewhere beyond the green gloom, you remember a road home—but every direction looks the same.",
        choices: [
          { text: "Follow the mossy trail north", next: "fork" },
          { text: "Push through ferns toward a distant glow", next: "clearing" },
          { text: "Investigate rustling in the underbrush", next: "thicket", health: -1 },
        ],
      },

      fork: {
        title: "The Old Fork",
        description:
          "The trail splits three ways. A carved sign, half-swallowed by lichen, reads: \"Stream — Ruins — Deep Wood.\" Your boots are still caked in mud from wherever you fell.",
        choices: [
          { text: "Take the path to the stream", next: "stream" },
          { text: "Head toward the ruins", next: "ruins" },
          { text: "Brave the Deep Wood shortcut", next: "deepwood", health: -2 },
        ],
      },

      stream: {
        title: "Silver Creek",
        description:
          "Cold water murmurs over smooth stones. On the far bank, lantern-light flickers through birch trees—maybe a cottage, maybe a trap. A rope bridge sags beside a shallow ford.",
        choices: [
          { text: "Wade carefully across the ford", next: "homeward" },
          { text: "Cross the rotting rope bridge", next: "homeward", health: -1 },
          { text: "Follow the creek upstream", next: "cave", treasure: true },
        ],
      },

      cave: {
        title: "Hidden Grotto",
        description:
          "Behind a curtain of ivy, a shallow cave holds a wooden chest bound in green copper. The lid opens with a sigh of stale air. Inside: a small golden compass that always points toward warmth—and home.",
        choices: [
          { text: "Take the compass and retrace your steps", next: "homeward" },
          { text: "Leave an offering and slip away quietly", next: "clearing" },
        ],
      },

      ruins: {
        title: "Sunken Stones",
        description:
          "Crumbling walls ring a courtyard where foxglove grows wild. In the center, a stone well reflects stars though it is midday. Something glints at the bottom—or is it your imagination?",
        choices: [
          { text: "Climb down the well for the glint", next: "ruins_depth", health: -1, treasure: true },
          { text: "Circle the ruins and exit east", next: "clearing" },
          { text: "Rest here and listen", next: "fork" },
        ],
      },

      ruins_depth: {
        title: "Cold Water, Warm Gold",
        description:
          "You reach the water gasping. A watertight pouch holds a handful of ancient coins and a key shaped like a leaf. You claw your way back up, shivering but richer.",
        choices: [
          { text: "Stumble toward the distant treeline", next: "homeward" },
        ],
      },

      thicket: {
        title: "Thorns and Teeth",
        description:
          "A badger bursts from the brush—not a monster, but startling. You scrape your arm on thorns backing away. Ahead, a narrow deer track opens toward a sunlit gap in the trees.",
        choices: [
          { text: "Follow the deer track to the light", next: "clearing" },
          { text: "Return to the mossy trail", next: "fork" },
        ],
      },

      deepwood: {
        title: "Under Dark Boughs",
        description:
          "Branches claw at your coat. You trip over a root and taste pine needles. Still, the Deep Wood spits you out near a familiar fence line—you smell woodsmoke on the wind.",
        choices: [
          { text: "Run toward the smoke", next: "homeward" },
        ],
      },

      clearing: {
        title: "Sunlit Clearing",
        description:
          "Meadow grass glows gold at the forest's edge. A worn footpath leads to a gate with your initials carved clumsily into the post. Home is one honest walk away.",
        choices: [
          { text: "Walk home through the gate", next: "homeward" },
          { text: "Search the clearing one last time", next: "clearing_search" },
        ],
      },

      clearing_search: {
        title: "Last Look Around",
        description:
          "You kick through clover and find nothing but a child's marble and peace. The gate waits, patient.",
        choices: [
          { text: "Go home", next: "homeward" },
        ],
      },

      homeward: {
        title: "The Last Stretch",
        description:
          "The path rises to a lane you know by heart. Porch light. A dog barks once, friendly. You wrap your fingers around whatever you carried out of the wood.",
        choices: [
          { text: "Step inside and close the door", next: "_resolve_home" },
        ],
      },

      ending_treasure: {
        title: "Home, With Fortune",
        description:
          "You spread your treasure on the kitchen table—proof the forest gave more than fear. You lock the door, eat something hot, and sleep knowing the wild remembers your name.",
        ending: true,
        success: true,
        choices: [],
      },

      ending_escape: {
        title: "Safe at Last",
        description:
          "No gold, no legend—only muddy boots and a pounding heart that finally slows. You are home. The forest keeps its secrets, and tonight, that is enough.",
        ending: true,
        choices: [],
      },

      ending_bad: {
        title: "Lost to the Green",
        description:
          "Strength leaves you somewhere between root and shadow. The trees close like a book you cannot read. Your trail fades, and the forest grows quiet again.",
        ending: true,
        bad: true,
        choices: [],
      },
    };

    let health = INITIAL_HEALTH;
    let hasTreasure = false;
    let currentSceneId = START_SCENE;
    let gameOver = false;

    const sceneTitleEl = document.getElementById("scene-title");
    const sceneDescEl = document.getElementById("scene-desc");
    const choicesEl = document.getElementById("choices");
    const healthDisplayEl = document.getElementById("health-display");
    const treasureDisplayEl = document.getElementById("treasure-display");
    const footerActionsEl = document.getElementById("footer-actions");
    const restartBtn = document.getElementById("restart-btn");
    const gamePanel = document.getElementById("game-panel");
    const storyEl = document.getElementById("story");

    function isEndingScene(id) {
      const scene = scenes[id];
      return scene && scene.ending === true;
    }

    function renderHealth() {
      healthDisplayEl.innerHTML = "";
      for (let i = 0; i < INITIAL_HEALTH; i++) {
        const span = document.createElement("span");
        span.className = "heart" + (i < health ? " filled" : "");
        span.setAttribute("aria-hidden", "true");
        healthDisplayEl.appendChild(span);
      }
    }

    function renderTreasure() {
      treasureDisplayEl.classList.toggle("has-treasure", hasTreasure);
      treasureDisplayEl.setAttribute(
        "aria-label",
        hasTreasure ? "Treasure acquired" : "No treasure"
      );
    }

    function renderScene(id) {
      const scene = scenes[id];
      if (!scene) {
        console.error("Missing scene:", id);
        return;
      }

      currentSceneId = id;
      gameOver = isEndingScene(id);

      sceneTitleEl.textContent = scene.title;
      sceneDescEl.textContent = scene.description;

      storyEl.classList.remove("ending", "bad");
      if (gameOver) {
        storyEl.classList.add("ending");
        if (scene.bad) storyEl.classList.add("bad");
      }

      choicesEl.innerHTML = "";
      if (gameOver) {
        choicesEl.classList.add("disabled");
        choicesEl.setAttribute("aria-hidden", "true");
        footerActionsEl.classList.add("visible");
      } else {
        choicesEl.classList.remove("disabled");
        choicesEl.removeAttribute("aria-hidden");
        footerActionsEl.classList.remove("visible");

        (scene.choices || []).forEach((choice, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice-btn";
          btn.textContent = choice.text;
          btn.addEventListener("click", () => onChoice(choice));
          choicesEl.appendChild(btn);
        });
      }

      renderHealth();
      renderTreasure();
    }

    function applyChoiceEffects(choice) {
      if (typeof choice.health === "number") {
        health += choice.health;
      }
      if (choice.treasure === true) {
        hasTreasure = true;
      }
    }

    function resolveNextScene(nextId) {
      if (nextId === "_resolve_home") {
        return hasTreasure ? "ending_treasure" : "ending_escape";
      }
      return nextId;
    }

    function onChoice(choice) {
      if (gameOver) return;

      applyChoiceEffects(choice);

      if (health <= 0) {
        renderHealth();
        renderScene("ending_bad");
        return;
      }

      let nextId = resolveNextScene(choice.next);
      if (!scenes[nextId]) {
        console.error("Invalid next scene:", nextId);
        return;
      }

      renderScene(nextId);
    }

    function restartGame() {
      health = INITIAL_HEALTH;
      hasTreasure = false;
      gameOver = false;
      renderScene(START_SCENE);
    }

    restartBtn.addEventListener("click", restartGame);

    // Self-check: verify all choice next IDs exist (or special resolvers)
    (function validateScenes() {
      const special = new Set(["_resolve_home"]);
      for (const [id, scene] of Object.entries(scenes)) {
        if (!scene.choices) continue;
        for (const c of scene.choices) {
          if (special.has(c.next)) continue;
          if (!scenes[c.next]) {
            console.warn("Pocket Quest: broken link", id, "->", c.next);
          }
        }
      }
    })();

    renderScene(START_SCENE);
  </script>
</body>
</html>
